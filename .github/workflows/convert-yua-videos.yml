name: Convert YUA videos to browser MP4
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Convert videos and update the site
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(assets/experience/experience-video-*.mov)
          if [ ${#files[@]} -eq 0 ]; then exit 0; fi
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          for src in "${files[@]}"; do
            out="${src%.mov}.mp4"
            ffmpeg -y -i "$src" -map_metadata -1 -c:v libx264 -pix_fmt yuv420p -preset medium -crf 23 -c:a aac -b:a 128k -movflags +faststart "$out"
          done
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text()
          for i in range(1, 7):
              stem = f'assets/experience/experience-video-{i:02}'
              html = html.replace(stem + '.mov', stem + '.mp4')
          html = html.replace('type="video/quicktime"', 'type="video/mp4"')
          p.write_text(html)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git add -f assets/experience/experience-video-*.mp4
          git rm .github/workflows/convert-yua-videos.yml
          git commit -m 'Convert YUA experience videos to browser MP4'
          git push